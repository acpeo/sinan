[package]
name = "sinan"
version = "0.1.0"
description = "司南 — 北斗任务台：看北斗的活跑到哪了"
authors = ["acpeo"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "sinan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hex = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
# Ed25519 设备签名（网关 connect 握手）。
ring = "0.17"
# OpenClaw Gateway 任务连接器：同步 WebSocket 客户端（握手/分帧/ping-pong 自带），
# 不引入异步运行时。
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
# 关掉系统给无边框窗口画的圆角（玻璃外壳自绘圆角，双层圆角会破皮）。
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
] }

[profile.release]
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
