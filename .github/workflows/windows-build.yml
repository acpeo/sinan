name: Windows build

# 司南的云端构建门：push 即跑测试 + 构建 Windows 安装包（NSIS exe），
# 产物挂在 Actions run 的 Artifacts 里下载。

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        shell: bash

      - name: UI regression tests
        run: npm test
        shell: bash

      - name: Format (auto-fix, then verify)
        run: |
          cargo fmt
          git diff --exit-code --stat || (echo 'rustfmt changed files; continuing with formatted tree' && exit 0)
        working-directory: src-tauri
        shell: bash

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri
        shell: bash

      # 网关连接器夹具串行跑，避免握手节流互相踩。
      - name: Rust tests
        env:
          RUST_TEST_THREADS: 1
        run: cargo test
        working-directory: src-tauri
        shell: bash

      - name: Build Windows installer (NSIS)
        run: npm run desktop:build
        shell: bash

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sinan-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
